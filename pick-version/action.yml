name: Pick the release version
description: >-
  Works out the next version from the commits with git-cliff, or checks the one requested, and fails
  when there's nothing to release. Needs a full-history checkout (fetch-depth: 0) and git-cliff
  runnable with bunx.
inputs:
  version:
    description: Version to release, like 0.2.0. Leave empty to work it out from the commits.
    required: false
    default: ""
outputs:
  version:
    description: The version to release, without a leading v.
    value: ${{ steps.pick.outputs.version }}
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
      run: |
        # The latest tag, not package.json: some repos only bump it on the runner.
        latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)"
        if [ -n "$REQUESTED" ]; then
          version="${REQUESTED#v}"
        else
          version="$(bunx git-cliff --bumped-version)"
          version="${version#v}"
        fi
        if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "\"$version\" isn't a version like 1.2.3" >&2
          exit 1
        fi
        # git-cliff returns the latest version when every commit since it is skipped (deps, chores).
        if [ "v$version" = "$latest" ]; then
          echo "Nothing to release: no feat, fix, perf, docs or breaking commits since $latest" >&2
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
          echo "Tag v$version already exists" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
